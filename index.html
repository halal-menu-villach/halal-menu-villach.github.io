<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Halal Menu Check</title>
  <meta name="description" content="Which canteen dishes are halal-friendly today? Daily check of the canteen menu with clear explanations." />
  <meta name="theme-color" content="#0f8a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Halal Menu" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
:root {
  --bg: #f5f7f6;
  --card: #ffffff;
  --text: #1d2a26;
  --muted: #66756f;
  --border: #e3e9e6;
  --accent: #0f8a5f;
  --green: #16a34a;
  --green-bg: #e8f7ee;
  --orange: #d97706;
  --orange-bg: #fff4e0;
  --red: #dc2626;
  --red-bg: #fdecec;
  --grey: #8a958f;
  --grey-bg: #eef1ef;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --radius: 14px;
}
[data-theme="dark"] {
  --bg: #0f1513;
  --card: #18211e;
  --text: #e6eeea;
  --muted: #93a39c;
  --border: #26322e;
  --accent: #34d399;
  --green-bg: #12301f;
  --orange-bg: #33260f;
  --red-bg: #3a1616;
  --grey-bg: #222b28;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
main { max-width: 1240px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 12px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
}
.brand { display: flex; gap: 10px; align-items: center; }
.logo { width: 36px; height: 36px; border-radius: 9px; }
.sub { font-size: 13px; text-decoration: none; }
.controls { display: flex; gap: 10px; align-items: center; }
.ctl { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
select, input[type=search] {
  background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; font: inherit;
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 7px 10px; cursor: pointer; font-weight: 600; }
.seg button.active { background: var(--accent); color: #fff; }
.icon-btn, .pill-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px;
  padding: 7px 12px; cursor: pointer; font: inherit;
}
.icon-btn:hover, .pill-btn:hover { border-color: var(--accent); }
.pill-btn { border-radius: 999px; font-weight: 600; }
.pill-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.pill-btn.ghost { background: transparent; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.weekbar { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
.weektitle { display: flex; flex-direction: column; flex: 1; text-align: center; }
.weektitle span { color: var(--muted); font-size: 13px; }
.daytabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; }
.daytab {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; cursor: pointer;
  text-align: left; color: var(--text); font: inherit; position: relative;
}
.daytab.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.daytab .d { font-weight: 700; }
.daytab .dt { color: var(--muted); font-size: 12px; }
.daytab .bar { display: flex; height: 6px; border-radius: 4px; overflow: hidden; margin-top: 6px; background: var(--grey-bg); }
.daytab .today-dot { position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--accent); font-weight: 700; }
.daytab .fav-dot { position: absolute; bottom: 14px; right: 10px; font-size: 11px; }
.seg-green { background: var(--green); } .seg-orange { background: var(--orange); } .seg-red { background: var(--red); } .seg-grey { background: var(--grey); }
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 14px; }
.hero .big { font-size: 28px; font-weight: 800; line-height: 1.15; }
.hero .big .n { color: var(--green); }
.hero .counts { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.count { padding: 6px 10px; border-radius: 10px; font-weight: 600; font-size: 13px; }
.count.green { background: var(--green-bg); color: var(--green); }
.count.orange { background: var(--orange-bg); color: var(--orange); }
.count.red { background: var(--red-bg); color: var(--red); }
.count.grey { background: var(--grey-bg); color: var(--grey); }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.best { border-radius: 12px; background: var(--green-bg); padding: 12px; display: flex; gap: 12px; align-items: center; }
.best img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; flex: none; }
.best .lbl { font-size: 12px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .04em; }
.best .nm { font-weight: 700; }
.best .why { font-size: 12px; color: var(--muted); }
.best.none { background: var(--orange-bg); }
.best.none .lbl { color: var(--orange); }
.hero .actions a.pill-btn { text-decoration: none; }
.toolbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.toolbar-right { display: flex; gap: 10px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.chip.active { background: var(--text); color: var(--card); border-color: var(--text); }
.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.status { color: var(--muted); margin: 8px 0; }
.status:empty { display: none; }
.status.error { color: var(--red); }
.status.info { background: var(--orange-bg); color: var(--text); border-radius: 10px; padding: 8px 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; margin-bottom: 18px; }
.dish { display: flex; flex-direction: column; overflow: hidden; padding: 0; border-left: 6px solid var(--grey); }
.dish.green { border-left-color: var(--green); } .dish.orange { border-left-color: var(--orange); }
.dish.red { border-left-color: var(--red); } .dish.grey { border-left-color: var(--grey); }
.dish.red .photo, .dish.red .name { opacity: .75; }
.dish .top { display: flex; gap: 12px; padding: 14px 14px 8px; }
.dish .photo { width: 92px; height: 92px; border-radius: 10px; object-fit: cover; flex: none; background: var(--grey-bg); display: flex; align-items: center; justify-content: center; font-size: 34px; }
.dish .meta { flex: 1; min-width: 0; }
.dish .cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 6px; }
.dish .name { font-weight: 650; margin: 2px 0 6px; }
.dish .alt { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 6px; }
.pill { display: inline-flex; gap: 4px; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.green { background: var(--green-bg); color: var(--green); } .pill.orange { background: var(--orange-bg); color: var(--orange); }
.pill.red { background: var(--red-bg); color: var(--red); } .pill.grey { background: var(--grey-bg); color: var(--grey); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 4px; }
.badge.best-b { background: #fde68a; color: #7c5800; } .badge.sold { background: var(--grey-bg); color: var(--muted); }
.findings { list-style: none; margin: 0; padding: 0 14px 6px; font-size: 13px; }
.findings li { padding: 3px 0; display: flex; gap: 6px; }
.findings .haram { color: var(--red); } .findings .doubtful { color: var(--orange); }
.findings .caution { color: var(--muted); } .findings .ok { color: var(--green); }
.dish .foot { margin-top: auto; padding: 8px 14px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { background: var(--grey-bg); border-radius: 6px; padding: 2px 6px; font-size: 11px; }
.allergen { display: inline-block; min-width: 18px; text-align: center; border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; margin-right: 2px; font-size: 11px; cursor: help; }
.fav { background: none; border: 0; font-size: 18px; cursor: pointer; padding: 0; line-height: 1; filter: grayscale(1); opacity: .5; }
.fav.on { filter: none; opacity: 1; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.ov-row { display: grid; grid-template-columns: 110px 1fr 54px; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }
.ov-row:hover .ov-day { color: var(--accent); }
.ov-bar { display: flex; height: 14px; border-radius: 6px; overflow: hidden; background: var(--grey-bg); }
.ov-pct { text-align: right; font-weight: 700; font-size: 13px; }
.trend svg { width: 100%; height: auto; }
.trend text { fill: var(--muted); font-size: 11px; }
.legend ul { margin: 0 0 8px; padding-left: 18px; }
.legend li { margin: 4px 0; }
.disclaimer { background: var(--orange-bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 0; }
.welcome { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; background: var(--green-bg); border-color: transparent; }
.welcome[hidden] { display: none; }
.reminder-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.reminder-row input[type=time] { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; font: inherit; margin-left: 6px; }
.steps { margin: 8px 0 14px; padding-left: 20px; }
.rem-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.rem-opt { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.rem-opt h3 { margin-top: 0; }
.rem-opt .steps { font-size: 13px; }
.small-link { font-size: 12px; color: var(--muted); display: inline-block; margin-top: 8px; }
@media (max-width: 640px) { .rem-options { grid-template-columns: 1fr; } }
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--text); max-width: 640px; width: 92vw; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog li { margin: 8px 0; }
dialog h3 { font-size: 14px; margin: 16px 0 6px; }
dialog input[type=text], dialog input[type=search] { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; font: inherit; }
.canteen-results { max-height: 200px; overflow: auto; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.canteen-results button { text-align: left; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.canteen-results button:hover { border-color: var(--accent); }
.canteen-results small { color: var(--muted); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--card);
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.small { font-size: 12px; }
.prayer {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; width: 100%;
  border: 0; border-bottom: 1px solid var(--border); background: var(--green-bg); color: var(--text);
  padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer;
}
.prayer[hidden] { display: none; }
.prayer .pt b { font-weight: 600; color: var(--muted); margin-right: 3px; }
.prayer .pt.next { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 9px; }
.prayer .pt.next b { color: #fff; }
.prayer .pt-city { font-weight: 700; }
.prayer .pt-next, .prayer .pt-hijri { color: var(--muted); }
.prayer-table { margin: 6px 0 12px; }
.prayer-table .prow { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid var(--border); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.badge.kitchen { background: var(--green-bg); color: var(--green); display: inline-block; margin: 4px 0 0 6px; }
.allergy-hit { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--red); }
.allergen.hit { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 700; }
.allergy-note { margin: -4px 0 10px; font-size: 13px; }
.allergy-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin: 10px 0; }
.allergy-item { border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.allergy-item.on { border-color: var(--red); background: var(--red-bg); }
.allergy-hide { margin: 6px 0 14px; }
#allergyBtn.active { border-color: var(--red); color: var(--red); }
.ask-list li { margin: 10px 0; }
.ask-list .q-de { font-weight: 600; }
.ask-list .q-en { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ask-list li.none { list-style: none; }
.canteen-results button.picked { border-color: var(--accent); }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 10px 30px; }
.print-view { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff !important; color: #000 !important; }
  body > *:not(#printView) { display: none !important; }
  .print-view { display: block !important; font: 11pt/1.35 "Segoe UI", system-ui, sans-serif; color: #000; }
  .phead { display: flex; gap: 12px; align-items: center; border-bottom: 3px solid #0f8a5f; padding-bottom: 8px; margin-bottom: 10px; }
  .phead img { width: 46px; height: 46px; border-radius: 10px; }
  .phead h1 { font-size: 20pt; margin: 0; }
  .ptable { width: 100%; border-collapse: collapse; }
  .ptable th { text-align: left; background: #e8f7ee; padding: 6px 8px; font-size: 10.5pt; }
  .ptable td { border-bottom: 1px solid #ccc; padding: 6px 8px; vertical-align: top; }
  .ptable ul { margin: 0; padding-left: 14px; }
  .ptable small { color: #555; }
  .pday { width: 16%; white-space: nowrap; }
  .pbest { font-weight: 700; }
  .pfoot { display: flex; gap: 14px; align-items: center; margin-top: 12px; font-size: 10pt; }
  .pqr svg { width: 30mm; height: 30mm; display: block; }
  tr { break-inside: avoid; }
}
@media (max-width: 800px) {
  .hero, .two-col { grid-template-columns: 1fr; }
  .daytabs { grid-template-columns: repeat(4, 1fr); }
  .hero .big { font-size: 22px; }
  .topbar { padding: 8px 12px; }
  .controls { flex-wrap: wrap; justify-content: flex-end; }
  .ctl > span { display: none; }
  .toolbar-right { flex-wrap: wrap; }
  .toolbar-right input[type=search] { flex: 1; min-width: 140px; }
  .grid { grid-template-columns: 1fr; }
  .pill-btn, .chip { padding: 8px 12px; }
  .prayer { font-size: 12px; gap: 4px 10px; }
  .prayer .pt-hijri { display: none; }
}
@media (display-mode: standalone) {
  .topbar { padding-top: max(10px, env(safe-area-inset-top)); }
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="36" height="36" />
      <div>
        <h1 data-i18n="title">Halal Menu Check</h1>
        <a id="storeLink" class="sub" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="controls">
      <button id="installBtn" class="pill-btn primary" hidden data-i18n="install"></button>
      <button id="reminderTopBtn" class="pill-btn" data-i18n="btn_reminder"></button>
      <label class="ctl" data-i18n-title="mode_title">
        <span data-i18n="mode"></span>
        <select id="mode">
          <option value="standard" data-i18n="mode_standard"></option>
          <option value="strict" data-i18n="mode_strict"></option>
          <option value="relaxed" data-i18n="mode_relaxed"></option>
        </select>
      </label>
      <div class="seg" id="langSeg" data-i18n-title="lang_title">
        <button data-lang="en">EN</button><button data-lang="de">DE</button>
      </div>
      <button id="themeBtn" class="icon-btn" data-i18n-title="theme_title">🌙</button>
      <button id="settingsBtn" class="icon-btn" data-i18n-title="settings_title" hidden>⚙️</button>
    </div>
  </header>

  <button id="prayer" class="prayer" hidden></button>

  <main>
    <section class="weekbar">
      <button id="prevWeek" class="icon-btn" data-i18n-title="prev_week">◀</button>
      <div class="weektitle"><strong id="weekTitle"></strong><span id="weekRange"></span></div>
      <button id="nextWeek" class="icon-btn" data-i18n-title="next_week">▶</button>
      <button id="todayBtn" class="pill-btn" data-i18n="today"></button>
    </section>

    <nav id="dayTabs" class="daytabs"></nav>

    <section id="welcome" class="card welcome" hidden>
      <div>
        <div data-i18n-html="welcome_html"></div>
        <div class="muted" style="margin-top:4px" data-i18n-html="welcome_tip_html"></div>
      </div>
      <button id="welcomeClose" class="icon-btn" data-i18n-title="close">✕</button>
    </section>

    <div id="status" class="status"></div>
    <section id="hero" class="hero card"></section>

    <section class="toolbar">
      <div class="chips" id="filterChips">
        <button data-filter="all" class="chip active" data-i18n="filter_all"></button>
        <button data-filter="halal" class="chip" data-i18n="filter_halal"></button>
        <button data-filter="doubtful" class="chip" data-i18n="filter_doubtful"></button>
        <button data-filter="haram" class="chip" data-i18n="filter_haram"></button>
        <button data-filter="fav" class="chip" data-i18n="filter_fav"></button>
      </div>
      <div class="toolbar-right">
        <button id="allergyBtn" class="chip"></button>
        <label class="toggle"><input type="checkbox" id="hideNight" /> <span data-i18n="hide_night"></span></label>
        <input id="search" type="search" data-i18n-ph="search_ph" />
      </div>
    </section>

    <div id="allergyNote" class="muted allergy-note" hidden></div>
    <section id="dishes" class="grid"></section>

    <section class="two-col">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="overview_h"></h2>
          <button id="printBtn" class="pill-btn" data-i18n="print_btn"></button>
        </div>
        <div id="weekOverview"></div>
      </div>
      <div class="card">
        <h2 data-i18n="trend_h"></h2>
        <div id="trend" class="trend"></div>
      </div>
    </section>

    <section class="card legend">
      <h2 data-i18n="how_h"></h2>
      <ul data-i18n-html="how_list_html"></ul>
      <p class="disclaimer" data-i18n-html="disclaimer_html"></p>
    </section>

    <footer class="footer" data-i18n-html="footer_html"></footer>
  </main>

  <dialog id="reminderDialog">
    <form method="dialog">
      <h2 data-i18n="reminder_h"></h2>
      <div class="reminder-row">
        <label><span data-i18n="rem_time"></span> <input id="remTime" type="time" value="10:30" /></label>
        <label class="toggle"><input id="remWeekend" type="checkbox" /> <span data-i18n="rem_weekend"></span></label>
      </div>
      <div class="rem-options">
        <div class="rem-opt">
          <h3 data-i18n="rem_win_h"></h3>
          <p class="muted" data-i18n="rem_win_p"></p>
          <ol class="steps" data-i18n-html="rem_win_steps_html"></ol>
          <button type="button" id="remWin" class="pill-btn primary" data-i18n="download"></button>
          <div><a href="#" id="remWinRemove" class="small-link" data-i18n="rem_win_remove"></a></div>
        </div>
        <div class="rem-opt">
          <h3 data-i18n="rem_cal_h"></h3>

"use strict";
function buildIcs(time, weekends) {
  const [hh, mm] = time.split(":").map(Number);
  const p2 = (n) => String(n).padStart(2, "0");
  const now = new Date();
  const ymd = `${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}`;
  const end = new Date(2000, 0, 1, hh, mm + 5);
  const url = siteUrl();
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const escTxt = (s) => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const enc = new TextEncoder();
  const fold = (line) => {
    if (enc.encode(line).length <= 75) return line;
    const out = []; let cur = "", n = 0;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; n = 0; }
      cur += ch; n += b;
    }
    out.push(cur);
    return out.join("\r\n ");
  };
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Halal Menu Check//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VTIMEZONE", "TZID:Europe/Vienna",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST", "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET", "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT",
    "UID:halal-menu-check-daily-reminder@halal-menu-check",
    `DTSTAMP:${stamp}`,
    `DTSTART;TZID=Europe/Vienna:${ymd}T${p2(hh)}${p2(mm)}00`,
    `DTEND;TZID=Europe/Vienna:${ymd}T${p2(end.getHours())}${p2(end.getMinutes())}00`,
    `RRULE:FREQ=WEEKLY;BYDAY=${weekends ? "MO,TU,WE,TH,FR,SA,SU" : "MO,TU,WE,TH,FR"}`,
    `SUMMARY:${escTxt(t("ics_summary"))}`,
    `DESCRIPTION:${escTxt(t("ics_desc", { url }))}`,
    `LOCATION:${escTxt(url)}`,
    `URL:${url}`,
    "TRANSP:TRANSPARENT", "X-MICROSOFT-CDO-BUSYSTATUS:FREE", "CLASS:PUBLIC",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escTxt(t("ics_summary"))}`, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ];
  return lines.map(fold).join("\r\n") + "\r\n";
}
const WIN_REMINDER_PS = [
  "#PSSTART",
  "$ErrorActionPreference = 'Stop'",
  "$TaskName = 'Halal menu reminder'",
  "if (__REMOVE__) {",
  "  Unregister-ScheduledTask -TaskName $TaskName -Confirm:$false -ErrorAction SilentlyContinue",
  "  Write-Host ''; Write-Host '  __T_REMOVED__' -ForegroundColor Green",
  "  return",
  "}",
  "$Url = '__URL__'",
  "$tpl = @'",
  "if (__LATE__ -and (Get-Date).Hour -ge 15) { exit }",
  "[Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime] | Out-Null",
  "[Windows.Data.Xml.Dom.XmlDocument, Windows.Data.Xml.Dom.XmlDocument, ContentType = WindowsRuntime] | Out-Null",
  "$x = New-Object Windows.Data.Xml.Dom.XmlDocument",
  "$x.LoadXml('<toast launch=\"__URL__\" activationType=\"protocol\" duration=\"long\"><visual><binding template=\"ToastGeneric\"><text>__TITLE__</text><text>__TEXT__</text></binding></visual><actions><action content=\"__T_OPEN__\" activationType=\"protocol\" arguments=\"__URL__\"/><action content=\"__T_LATER__\" activationType=\"system\" arguments=\"dismiss\"/></actions></toast>')",
  "[Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\\WindowsPowerShell\\v1.0\\powershell.exe').Show([Windows.UI.Notifications.ToastNotification]::new($x))",
  "'@",
  "function Enc($title, $text, $late) {",
  "  $s = $tpl.Replace('__URL__', $Url).Replace('__TITLE__', $title).Replace('__TEXT__', $text).Replace('__LATE__', $late)",
  "  [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($s))",
  "}",
  "$daily = Enc '__T_TITLE__' '__T_TEXT__' '$true'",
  "$hello = Enc '__T_OK_TITLE__' '__T_OK_TEXT__' '$false'",
  "$action = New-ScheduledTaskAction -Execute 'conhost.exe' -Argument \"--headless powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $daily\"",
  "$trigger = New-ScheduledTaskTrigger -Weekly -DaysOfWeek @(__DAYS__) -At '__TIME__'",
  "$settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)",
  "Register-ScheduledTask -TaskName $TaskName -Action $action -Trigger $trigger -Settings $settings -Description \"Halal menu reminder: $Url\" -Force | Out-Null",
  "Start-Process conhost.exe -ArgumentList '--headless', 'powershell.exe', '-NoProfile', '-EncodedCommand', $hello",
  "Write-Host ''; Write-Host '  __T_DONE__' -ForegroundColor Green",
  "Write-Host '  __T_CLOSE__'",
];
function buildWinReminder(time, weekends, remove = false) {
  const days = weekends ? ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
    : ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const daysText = t(weekends ? "win_days_all" : "win_days_week");
  const safe = (s) => s.replace(/'/g, "’").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const plain = (s) => s.replace(/'/g, "’");
  const tokens = {
    __REMOVE__: remove ? "$true" : "$false",
    __URL__: safe(siteUrl()),
    __T_REMOVED__: plain(t("win_removed")),
    __T_OPEN__: safe(t("win_open")),
    __T_LATER__: safe(t("win_later")),
    __T_TITLE__: safe(t("win_title")),
    __T_TEXT__: safe(t("win_text")),
    __T_OK_TITLE__: safe(t("win_ok_title")),
    __T_OK_TEXT__: safe(t("win_ok_text", { time, days: daysText })),
    __DAYS__: days.map((d) => `'${d}'`).join(","),
    __TIME__: time,
    __T_DONE__: plain(t("win_done", { time, days: daysText })),
    __T_CLOSE__: plain(t("win_close")),
  };
  let ps = WIN_REMINDER_PS.join("\r\n");
  for (const [k, v] of Object.entries(tokens)) ps = ps.replace(k, () => v);
  const bat = [
    "@echo off",
    "title Halal Menu Check",
    "echo Halal Menu Check - please wait / bitte warten...",
    "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"$s = Get-Content -LiteralPath '%~f0' -Raw -Encoding UTF8; Invoke-Expression $s.Substring($s.IndexOf('#PS' + 'START'))\"",
    "echo.",
    "pause",
    "exit /b",
  ];
  return bat.join("\r\n") + "\r\n" + ps + "\r\n";
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function openReminder() {
  const time = () => $("#remTime").value || "10:30";
  $("#remDownload").onclick = () => {
    download("Halal-menu-reminder.ics", buildIcs(time(), $("#remWeekend").checked), "text/calendar;charset=utf-8");
    toast(t("rem_cal_done"));
  };
  $("#remWin").onclick = () => {
    download("Halal-menu-reminder.cmd", buildWinReminder(time(), $("#remWeekend").checked), "application/octet-stream");
    toast(t("rem_win_done"));
  };
  $("#remWinRemove").onclick = (e) => {
    e.preventDefault();
    download("Remove-halal-menu-reminder.cmd", buildWinReminder(time(), false, true), "application/octet-stream");
    toast(t("rem_win_rm_done"));
  };
  $("#reminderDialog").showModal();
}

    <div class="phead"><img src="icon-192.png" alt="" /><div><h1>${esc(t("print_title", { w: wk.week }))}</h1><div>${esc(range)} · ${esc(wk.store)}</div></div></div>
    <table class="ptable"><thead><tr><th>${esc(t("print_day"))}</th><th>${esc(t("print_halal"))}</th><th>${esc(t("print_doubtful"))}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pfoot">${qr ? `<div class="pqr">${qr}</div>` : ""}<div><b>${esc(t("print_scan"))}</b><br>${esc(siteUrl())}<br><small>${esc(t("print_note"))}</small></div></div>`;
  window.print();
}
function setStoreLink(cfg) {
  $("#storeLink").textContent = `${cfg.store_name} · ${cfg.menu_name}`;
  $("#storeLink").href = cfg.portal_url;
}
function shareUrl() {
  const m = window.LocalApi.settings.menu;
  const u = new URL(location.href);
  u.search = new URLSearchParams({ menu: m.id, store: m.store, name: m.menu }).toString();
  return u.toString();
}
function openSettings() {
  const L = window.LocalApi;
  let chosen = L.settings.menu;
  const cur = () => { $("#curCanteen").textContent = `${chosen.store} · ${chosen.menu}`; };
  cur();
  $("#avoidInput").value = L.settings.avoid.join(", ");
  const hosted = location.protocol.startsWith("http");
  $("#copyLink").hidden = !hosted;
  $("#shareHint").innerHTML = hosted ? esc(t("share_hosted")) : t("share_file_html");
  $("#copyLink").onclick = () => copyText(shareUrl(), t("link_copied"));
  const results = $("#canteenResults");
  const search = async () => {
    results.innerHTML = `<span class="muted">${esc(t("searching"))}</span>`;
    try {
      const hits = (await L.findMenus($("#canteenSearch").value)).slice(0, 60);
      results.innerHTML = hits.length ? hits.map((h, k) =>
        `<button type="button" data-k="${k}">${esc(h.store)} · ${esc(h.menu)} <small>${esc(h.city || "")}</small></button>`).join("")
        : `<span class="muted">${esc(t("no_canteen"))}</span>`;
      results.querySelectorAll("button").forEach((b) => (b.onclick = () => {
        const h = hits[b.dataset.k];
        chosen = { id: h.id, store: h.store, menu: h.menu, city: h.city, lat: h.lat, lng: h.lng };
        cur();
        results.querySelectorAll("button").forEach((x) => x.classList.toggle("picked", x === b));
      }));
    } catch { results.innerHTML = `<span class="status error">${esc(t("load_error"))}</span>`; }
  };
  $("#canteenSearch").oninput = () => { clearTimeout(search._t); search._t = setTimeout(search, 250); };
  $("#saveSettings").onclick = async () => {
    L.settings.menu = chosen;
    L.settings.avoid = $("#avoidInput").value.split(",").map((s) => s.trim()).filter(Boolean);
    $("#settingsDialog").close();
    state.cfg = await api("/api/config");
    setStoreLink(state.cfg);
    loadWeek(state.selected || state.today); loadTrend(); loadPrayer();
    toast(t("settings_saved"));
  };
  $("#settingsDialog").showModal();
  if (!results.innerHTML) search();
}
let installPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function setupInstall() {
  const btn = $("#installBtn");
  if (location.protocol !== "https:" || isStandalone()) return;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; btn.hidden = false; });
  window.addEventListener("appinstalled", () => { btn.hidden = true; toast(t("installed"), 4000); });
  if (isIos()) btn.hidden = false;
  btn.onclick = async () => {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => null);
      installPrompt = null; btn.hidden = true;
    } else {
      toast(t("install_ios"), 7000);
    }
  };
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("#themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  store.set("theme", theme);
}
function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  $$("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  $$("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  $$("#langSeg button").forEach((b) => b.classList.toggle("active", b.dataset.lang === state.lang));
  updateAllergyBtn();
}
document.addEventListener("click", (e) => {
  const tab = e.target.closest(".daytab, .ov-row");
  if (tab) {
    state.selected = tab.dataset.date; state.search = ""; $("#search").value = "";
    renderTabs(); renderHero(); renderDishes();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  const fav = e.target.closest(".fav");
  if (fav) {
    const k = fav.dataset.fav;
    state.favs.has(k) ? state.favs.delete(k) : state.favs.add(k);
    store.set("favs", [...state.favs]);
    toast(state.favs.has(k) ? t("fav_added") : t("fav_removed"));
    renderTabs(); renderHero(); renderDishes();
  }
  const chip = e.target.closest("#filterChips .chip");
  if (chip) {
    state.filter = chip.dataset.filter;
    $$("#filterChips .chip").forEach((c) => c.classList.toggle("active", c === chip));
    renderDishes();
  }
  const lb = e.target.closest("#langSeg button");
  if (lb) {
    state.lang = lb.dataset.lang; store.set("lang", state.lang);
    applyLang(); render(); renderTrend(); renderPrayer();
  }
});
$("#mode").addEventListener("change", (e) => {
  state.mode = e.target.value; store.set("mode", state.mode);
  loadWeek(state.selected || state.today); loadTrend();
});
$("#hideNight").addEventListener("change", (e) => { state.hideNight = e.target.checked; store.set("hideNight", state.hideNight); renderDishes(); });
$("#search").addEventListener("input", (e) => { state.search = e.target.value; renderDishes(); });
$("#prevWeek").onclick = () => loadWeek(addDays(state.week?.week_start || state.today, -7));
$("#nextWeek").onclick = () => loadWeek(addDays(state.week?.week_start || state.today, 7));
$("#todayBtn").onclick = () => loadWeek(state.today);
$("#themeBtn").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#allergyBtn").onclick = openAllergies;
$("#reminderTopBtn").onclick = openReminder;
$("#printBtn").onclick = printWeek;
$("#prayer").onclick = openPrayer;
(async function init() {
  applyTheme(store.get("theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  applyLang();
  $("#hideNight").checked = state.hideNight;
  try {
    state.cfg = await api("/api/config");
    state.today = state.cfg.today || state.today;
    state.mode = state.mode || state.cfg.default_mode || "standard";
    setStoreLink(state.cfg);
    if (state.cfg.standalone) { $("#settingsBtn").hidden = false; $("#settingsBtn").onclick = openSettings; }
  } catch { state.mode = state.mode || "standard"; }
  $("#mode").value = state.mode;
  if (!store.get("welcomed", false)) $("#welcome").hidden = false;
  $("#welcomeClose").onclick = () => { $("#welcome").hidden = true; store.set("welcomed", true); };
  setupInstall();
  loadPrayer();
  setInterval(renderPrayer, 60000);
  await loadWeek(state.today);
  loadTrend();
})();
</script>
</body>
</html>
